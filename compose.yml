services:
  vuln-fix-agent-api:
    build: .
    image: vuln-fix-agent:latest
    container_name: vuln-fix-agent-api
    restart: unless-stopped
    networks: [vuln-fix-agent-net]
    # Host-only: reachable from your Mac, not from the LAN.
    ports: ["127.0.0.1:9999:9999"]
    environment:
      A2A_TOKEN: ${A2A_TOKEN:?set A2A_TOKEN in .env}
      # Baked into the agent card as the endpoint callers dial. Local-only now, so the
      # host port is the honest answer; set PUBLIC_URL in .env if this is ever exposed.
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:9999}
      WORKSPACE: /home/agent/workspace
      STATE_DIR: /home/agent/state
      # gh pr create needs an API token; SSH can push and sign but cannot open a PR.
      GH_TOKEN: ${GH_TOKEN:-}
      # read:packages token for private GitHub Packages (npm.pkg.github.com). Exposed under
      # the names repo .npmrc files reference (PACKAGES_READ_TOKEN / NODE_AUTH_TOKEN) plus
      # its own, so `npm ci` / `pnpm install` on @ember-ai-engineering/* deps stop 403ing.
      GH_READ_PACKAGES_TOKEN: ${GH_READ_PACKAGES_TOKEN:-}
      PACKAGES_READ_TOKEN: ${GH_READ_PACKAGES_TOKEN:-}
      NODE_AUTH_TOKEN: ${GH_READ_PACKAGES_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      SSH_AUTH_KEY: ${SSH_AUTH_KEY:-}
      SSH_SIGN_KEY: ${SSH_SIGN_KEY:-}
      SSH_KEY_PASSPHRASE: ${SSH_KEY_PASSPHRASE:-}
      VANTA_CLIENT_ID: ${VANTA_CLIENT_ID:-}
      VANTA_CLIENT_SECRET: ${VANTA_CLIENT_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#development-and-pr-reviews}
    volumes:
      # Claude Code writes its OAuth credentials here. Survives restarts and rebuilds,
      # so the one-time `claude` login is genuinely one-time.
      - claude-auth:/home/agent/.claude
      # Container-owned workspace, not a Mac bind mount. Persists across rebuilds.
      - workspace:/home/agent/workspace
      # Remediation ledger — survives runs so unfixable CVEs aren't re-Slacked daily.
      - state:/home/agent/state
      # Populated by ./load-keys.sh — Docker Desktop refuses to bind-mount ~/.ssh,
      # and a volume holding only the 3 needed keys beats sharing the whole directory.
      - ssh-keys:/ssh-keys:ro
      # Host Docker daemon, so the agent can build the image and trivy-scan it.
      # ponytail: root-equivalent access to host Docker — acceptable for an
      # internal agent; revisit if this ever runs untrusted workloads.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  claude-auth:
  workspace:
  state:
  ssh-keys:

networks:
  vuln-fix-agent-net:
    name: vuln-fix-agent-net
